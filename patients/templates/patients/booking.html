{% extends "base.html" %}

{% block title %}Book an Appointment{% endblock %}

{% block content %}
    <header>
        <h1>Book an Appointment</h1>
    </header>
    <main>
        <form method="post">
            {% csrf_token %}
            <p>
                <label for="department">Department</label><br>
                <select id="department" name="department" required>
                    <option value="">Choose a department</option>
                    <option value="general_medicine">General Medicine</option>
                    <option value="cardiology">Cardiology</option>
                    <option value="pediatrics">Pediatrics</option>
                    <option value="dentistry">Dentistry</option>
                </select>
            </p>
            <p>
                <label for="doctor">Doctor (optional)</label><br>
                <input type="text" id="doctor" name="doctor">
            </p>
            <p>
                <label for="appointment_date">Preferred date</label><br>
                <input type="date" id="appointment_date" name="appointment_date" required>
            </p>
            <p>
                <label for="appointment_time">Preferred time</label><br>
                <input type="time" id="appointment_time" name="appointment_time" required>
            </p>
            <p>
                <label for="reason">Reason for visit</label><br>
                <textarea id="reason" name="reason" rows="4" required></textarea>
            </p>
            <button type="submit">Request Appointment</button>
        </form>
    </main>
{% endblock %}
